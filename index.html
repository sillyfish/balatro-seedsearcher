<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小丑牌选种器</title>
<style>
  @font-face{
    font-family:"m6x11";
    src:url("image/m6x11plus.ttf") format("truetype");
    font-display:swap;
  }
  @font-face{
    font-family:"balatro-cn";
    src:url("image/NotoSansSC-Bold.ttf") format("truetype");
    font-display:swap;
  }
  :root{
    --felt:#1d4a45;
    --panel:#3f4d4c;
    --panel-lite:#4d5c5a;
    --ink:#131f1e;
    --chip:#fdf6ec;
    --red:#fe5f55;      --red-dk:#c03a31;
    --blue:#009dff;     --blue-dk:#0068ad;
    --gold:#ffa200;     --gold-dk:#c06f00;
    --green:#4bc292;    --green-dk:#2c8560;
    --dim:#9cb0ad;
    --stroke:#e2e0d4;   /* 面板外描边 */
    /* 像素切角：4px 台阶 */
    --cut:polygon(
      0 8px, 4px 8px, 4px 4px, 8px 4px, 8px 0,
      calc(100% - 8px) 0, calc(100% - 8px) 4px, calc(100% - 4px) 4px, calc(100% - 4px) 8px, 100% 8px,
      100% calc(100% - 8px), calc(100% - 4px) calc(100% - 8px), calc(100% - 4px) calc(100% - 4px), calc(100% - 8px) calc(100% - 4px), calc(100% - 8px) 100%,
      8px 100%, 8px calc(100% - 4px), 4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px)
    );
    --cut-sm:polygon(
      0 6px, 3px 6px, 3px 3px, 6px 3px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 3px, calc(100% - 3px) 3px, calc(100% - 3px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 3px) calc(100% - 6px), calc(100% - 3px) calc(100% - 3px), calc(100% - 6px) calc(100% - 3px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 3px), 3px calc(100% - 3px), 3px calc(100% - 6px), 0 calc(100% - 6px)
    );
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;padding:16px 12px 70px;
    background:var(--felt);
    color:var(--chip);
    font-family:"m6x11","balatro-cn",ui-monospace,"PingFang SC","Microsoft YaHei",monospace;
    font-size:18px;line-height:1.45;
    image-rendering:pixelated;
  }
  .wrap{max-width:640px;margin:0 auto}

  /* ---- 标题 ---- */
  .title{text-align:center;margin:4px 0 2px}
  .title img{width:min(78%,330px);height:auto;image-rendering:pixelated}
  .sub{color:var(--dim);font-size:15px;text-align:center;margin:6px 0 20px}

  /* ---- 面板：外层描边 + 内层底色，都用切角 ---- */
  fieldset{
    border:none;margin:0 0 20px;padding:0;
    background:var(--stroke);
    clip-path:var(--cut);
    filter:drop-shadow(0 5px 0 rgba(0,0,0,.45));
  }
  .fs-in{
    margin:3px;padding:16px 14px 18px;
    background:var(--panel);
    clip-path:var(--cut);
  }
  legend{display:none}
  .cap{
    display:inline-block;margin:0 0 10px;padding:2px 12px 3px;
    font-size:16px;color:var(--ink);background:var(--gold);
    clip-path:var(--cut-sm);
    box-shadow:0 3px 0 var(--gold-dk);
  }

  label{display:block;font-size:14px;color:var(--dim);margin:12px 0 5px}
  input,select{
    width:100%;padding:9px 11px;border:none;
    background:var(--ink);color:var(--chip);
    font:inherit;font-size:17px;
    clip-path:var(--cut-sm);
  }
  input:focus,select:focus{outline:none;background:#0a1413}
  input::placeholder{color:#5d706e}
  .row{display:flex;gap:10px}.row>div{flex:1;min-width:0}

  /* ---- 按钮：切角 + 厚下沿 ---- */
  button{
    width:100%;margin-top:16px;padding:10px;
    border:none;cursor:pointer;
    background:var(--red);color:var(--chip);
    font:inherit;font-size:19px;
    clip-path:var(--cut-sm);
    box-shadow:0 5px 0 var(--red-dk);
    transition:transform .04s,box-shadow .04s;
  }
  button:active{transform:translateY(5px);box-shadow:0 0 0 var(--red-dk)}
  button.ghost{background:var(--blue);box-shadow:0 5px 0 var(--blue-dk);font-size:16px;padding:8px}
  button.ghost:active{box-shadow:0 0 0 var(--blue-dk)}
  button.gold{background:var(--gold);color:var(--ink);box-shadow:0 5px 0 var(--gold-dk)}
  button.gold:active{box-shadow:0 0 0 var(--gold-dk)}

  /* ---- 说明气泡 ---- */
  .i{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;margin-left:6px;vertical-align:0px;position:relative;top:1px;
    background:var(--dim);color:var(--panel);
    font-size:13px;cursor:pointer;flex:none;
    clip-path:polygon(
      0 6px, 2px 6px, 2px 4px, 4px 4px, 4px 2px, 6px 2px, 6px 0,
      calc(100% - 6px) 0, calc(100% - 6px) 2px, calc(100% - 4px) 2px, calc(100% - 4px) 4px,
      calc(100% - 2px) 4px, calc(100% - 2px) 6px, 100% 6px,
      100% calc(100% - 6px), calc(100% - 2px) calc(100% - 6px), calc(100% - 2px) calc(100% - 4px),
      calc(100% - 4px) calc(100% - 4px), calc(100% - 4px) calc(100% - 2px),
      calc(100% - 6px) calc(100% - 2px), calc(100% - 6px) 100%,
      6px 100%, 6px calc(100% - 2px), 4px calc(100% - 2px), 4px calc(100% - 4px),
      2px calc(100% - 4px), 2px calc(100% - 6px), 0 calc(100% - 6px));
  }
  .i:active{background:var(--gold)}
  #tip{
    display:none;position:fixed;z-index:200;left:50%;bottom:22px;
    transform:translateX(-50%);width:min(90vw,430px);
    background:var(--stroke);clip-path:var(--cut);
    box-shadow:0 0 0 100vmax rgba(0,0,0,.55);
  }
  #tip .tip-in{
    margin:3px;padding:15px 16px;background:var(--panel);
    clip-path:var(--cut);font-size:16px;line-height:1.65;color:var(--chip);
  }
  #tip b{color:var(--gold)}

  /* ---- 条件组 ---- */
  .wantgroup{
    background:var(--panel-lite);clip-path:var(--cut-sm);
    padding:9px 9px 6px;margin-top:10px;
  }
  .want{display:grid;grid-template-columns:1fr 84px 52px 30px;gap:6px;align-items:center;margin-top:5px}
  .want:first-child{margin-top:0}
  .want select,.want input{padding:7px 6px;font-size:15px}
  .want .del{
    width:30px;margin:0;padding:6px 0;font-size:17px;
    background:transparent;color:var(--dim);box-shadow:none;clip-path:none;
  }
  .want .del:active{transform:none;color:var(--red)}
  .or-row{margin-top:6px}
  .or-row button{width:auto;margin:0;padding:3px 12px;font-size:14px;
    background:var(--green);box-shadow:0 4px 0 var(--green-dk)}
  .or-row button:active{box-shadow:0 0 0 var(--green-dk)}

  .face{
    display:flex;align-items:center;gap:7px;padding:4px 8px;
    background:var(--ink);cursor:pointer;min-height:44px;overflow:hidden;
    clip-path:var(--cut-sm);
  }
  .fname{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chip{display:inline-block;flex:none;overflow:hidden;position:relative;vertical-align:middle}
  .chip img{display:block;image-rendering:pixelated;max-width:none}

  /* ---- 结果 ---- */
  .hit{
    padding:11px 13px;margin-top:10px;
    background:var(--panel-lite);clip-path:var(--cut-sm);
  }
  .hit{position:relative}
  .hit .seed{font-size:25px;color:var(--gold);letter-spacing:.15em;cursor:pointer}
  .hit .cp{
    position:absolute;top:10px;right:10px;width:auto;margin:0;
    padding:3px 11px;font-size:14px;
    background:var(--felt);box-shadow:0 3px 0 #12302d;
  }
  .hit .cp:active{box-shadow:0 0 0 #12302d}
  .tools{display:flex;gap:8px;margin-top:12px}
  .tools button{margin:0;flex:1;font-size:15px;padding:7px}
  .odds{
    margin-top:14px;padding:10px 12px;
    background:var(--panel-lite);clip-path:var(--cut-sm);
    font-size:15px;line-height:1.7;
  }
  .odds .big{font-size:19px;color:var(--gold)}
  .odds .lv{display:inline-block;padding:0 9px;margin-right:7px;font-size:14px;
    color:var(--ink);clip-path:var(--cut-sm)}
  .lv-easy{background:var(--green)}
  .lv-mid{background:var(--gold)}
  .lv-hard{background:var(--red);color:var(--chip)}
  .hit .where{font-size:15px;margin-top:5px;line-height:1.95}
  .ed{color:var(--red)}
  .stat{font-size:15px;color:var(--dim);margin-top:14px;line-height:1.8}
  .stat b{color:var(--gold)}
  .preview{font-size:15px;line-height:1.95}
  .preview .a{color:var(--gold)}
  .preview .o{color:var(--dim)}

  /* ---- 陈列柜 ---- */
  #picker{display:none;position:fixed;inset:0;z-index:99;
    background:rgba(19,31,30,.97);flex-direction:column;padding:12px}
  #picker .bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  #picker .bar input{flex:1;margin:0;background:var(--panel)}
  #picker .bar button{width:auto;margin:0;padding:9px 16px;font-size:16px}
  #pgrid{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .pgroup{
    color:var(--ink);font-size:15px;margin:14px 0 8px;padding:1px 12px 2px;
    background:var(--gold);display:inline-block;
    clip-path:var(--cut-sm);box-shadow:0 3px 0 var(--gold-dk);
  }
  .prow{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
  .pcard{
    width:auto;margin:0;padding:6px 2px 7px;
    background:var(--panel);clip-path:var(--cut-sm);
    box-shadow:0 4px 0 var(--ink);
    display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  .pcard:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
  .pname{font-size:13px;color:var(--dim);line-height:1.25;text-align:center;word-break:break-all}

  button,.face,.pcard,.i{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  button:focus{outline:none}
</style>
</head>
<body>
<div class="wrap">
<div class="title"><img src="image/balatro-logo.png" alt="BALATRO"></div>
<p class="sub">小丑牌种子生成器 ・ 按条件寻找称心的种子</p>

<fieldset><div class="fs-in">
  <div class="cap">筛选条件<span class="i" data-tip="cond" style="background:var(--ink);color:var(--gold);margin-left:8px">i</span></div>
  <div id="wants"></div>
  <button class="ghost" id="add">+ 增加条件</button>

  <div class="row" style="margin-top:16px">
    <div>
      <label>每底注看几个商店位<span class="i" data-tip="shop">i</span></label>
      <input id="slots" type="number" value="6">
    </div>
    <div>
      <label>找到几个就停<span class="i" data-tip="stop">i</span></label>
      <input id="found" type="number" value="5">
    </div>
  </div>

  <div style="display:flex;align-items:center;gap:8px;margin-top:16px;color:var(--chip);font-size:16px">
    <label style="display:flex;align-items:center;gap:8px;margin:0;color:inherit;font-size:inherit;cursor:pointer">
      <input type="checkbox" id="packs" checked style="width:auto;margin:0;clip-path:none"> 连卡包里的一起搜
    </label>
    <span class="i" data-tip="packs">i</span>
  </div>

  <label>从哪个种子开始数<span class="i" data-tip="from">i</span></label>
  <input id="from" placeholder="留空＝随机找个地方开始" autocapitalize="characters" spellcheck="false">

  <button class="gold" id="est">先估一下难度</button>
  <div class="odds" id="odds" style="display:none"></div>
  <button id="go">开始寻找</button>
  <button class="ghost" id="stop" style="display:none">结束搜寻</button>
  <div class="stat" id="stat"></div>
</div></fieldset>

<fieldset><div class="fs-in">
  <div class="cap">捞到的种子</div>
  <div id="hits" style="font-size:15px;color:var(--dim)">还没开始。</div>
  <div class="tools" id="tools" style="display:none">
    <button class="ghost" id="copyall">复制全部</button>
    <button class="ghost" id="clearall">清空列表</button>
  </div>
</div></fieldset>

<fieldset><div class="fs-in">
  <div class="cap">简易种子分析</div>
  <input id="one" placeholder="输入种子" autocapitalize="characters" spellcheck="false">
  <button class="ghost" id="peek" style="margin-top:12px">查询种子详情</button>
  <div class="preview" id="pv" style="margin-top:12px"></div>
</div></fieldset>

</div>

<div id="picker">
  <div class="bar">
    <input id="psearch" placeholder="输入小丑牌名称…" autocomplete="off">
    <button id="pclose">关闭</button>
  </div>
  <div id="pgrid"></div>
</div>

<div id="tip"><div class="tip-in">
  <div id="tiptext"></div>
  <button class="gold" id="tipclose">知道了</button>
</div></div>

<script type="text/plain" id="engine-src">
const POOLS = {
 1: ["Joker","Greedy Joker","Lusty Joker","Wrathful Joker","Gluttonous Joker","Jolly Joker","Zany Joker","Mad Joker","Crazy Joker","Droll Joker","Sly Joker","Wily Joker","Clever Joker","Devious Joker","Crafty Joker","Half Joker","Credit Card","Banner","Mystic Summit"," 8 Ball","Misprint","Raised Fist","Chaos the Clown","Scary Face","Abstract Joker","Delayed Gratification","Gros Michel","Even Steven","Odd Todd","Scholar","Business Card","Supernova","Ride the Bus","Egg","Runner","Ice Cream","Splash","Blue Joker","Faceless Joker","Green Joker","Superposition","To Do List","Cavendish","Red Card","Square Joker","Riff raff","Photograph","Reserved Parking","Mail In Rebate","Hallucination","Fortune Teller","Juggler","Drunkard","Golden Joker","Popcorn","Walkie Talkie","Smiley Face","Golden Ticket","Swashbuckler","Hanging Chad","Shoot the Moon"],
 2: ["Joker Stencil","Four Fingers","Mime","Ceremonial Dagger","Marble Joker","Loyalty Card","Dusk","Fibonacci","Steel Joker","Hack","Pareidolia","Space Joker","Burglar","Blackboard","Sixth Sense","Constellation","Hiker","Card Sharp","Madness","Seance","Vampire","Shortcut","Hologram","Cloud 9","Rocket","Midas Mask","Luchador","Gift Card","Turtle Bean","Erosion","To the Moon","Stone Joker","Lucky Cat","Bull","Diet Cola","Trading Card","Flash Card","Spare Trousers","Ramen","Seltzer","Castle","Mr Bones","Acrobat","Sock and Buskin","Troubadour","Certificate","Smeared Joker","Throwback","Rough Gem","Bloodstone","Arrowhead","Onyx Agate","Glass Joker","Showman","Flower Pot","Merry Andy","Oops All 6s","The Idol","Seeing Double","Matador","Satellite","Cartomancer","Astronomer","Bootstraps"],
 3: ["DNA","Vagabond","Baron","Obelisk","Baseball Card","Ancient Joker","Campfire","Blueprint","Wee Joker","Hit the Road","The Duo","The Trio","The Family","The Order","The Tribe","Stuntman","Invisible Joker","Brainstorm","Drivers License","Burnt Joker"],
 4: ["Canio","Triboulet","Yorick","Chicot","Perkeo"]
};
/* ===== 引擎（32 位手写版，逻辑与对拍通过的 BigInt 版完全一致） ===== */
function pseudohash(str){
  let num=1;
  for(let i=str.length;i>=1;i--)
    num=((1.1239285023/num)*str.charCodeAt(i-1)*Math.PI+Math.PI*i)%1;
  return num;
}
const round13=x=>parseFloat(x.toFixed(13));
const _b=new ArrayBuffer(8),_f=new Float64Array(_b),_u=new Uint32Array(_b);

class LuaRandom{
  constructor(){this.hi=new Uint32Array(4);this.lo=new Uint32Array(4);}
  gen(i,k,q,s){
    let zh=this.hi[i],zl=this.lo[i];
    /* a = ((z<<q) ^ z) >> (k-s) */
    let ah,al;
    if(q>=32){ah=zl<<(q-32);al=0;}
    else{ah=(zh<<q)|(zl>>>(32-q));al=zl<<q;}
    ah^=zh;al^=zl;
    const n=k-s;
    if(n>=32){al=ah>>>(n-32);ah=0;}
    else if(n>0){al=(al>>>n)|(ah<<(32-n));ah=ah>>>n;}
    /* b = (z & (M64<<(64-k))) << s */
    const m=64-k;                       /* 1..17，恒 <32 */
    let bh=zh,bl=zl&((0xFFFFFFFF<<m)>>>0);
    if(s>=32){bh=bl<<(s-32);bl=0;}
    else{bh=(bh<<s)|(bl>>>(32-s));bl=bl<<s;}
    const rh=(ah^bh)>>>0,rl=(al^bl)>>>0;
    this.hi[i]=rh;this.lo[i]=rl;
    return [rh,rl];
  }
  step(){
    let h=0,l=0,r;
    r=this.gen(0,63,31,18);h^=r[0];l^=r[1];
    r=this.gen(1,58,19,28);h^=r[0];l^=r[1];
    r=this.gen(2,55,24, 7);h^=r[0];l^=r[1];
    r=this.gen(3,47,21, 8);h^=r[0];l^=r[1];
    this._h=h>>>0;this._l=l>>>0;
  }
  seed(d){
    let r=0x11090601;
    for(let i=0;i<4;i++){
      const m=(1<<(r&255))>>>0;r>>>=8;
      d=d*3.14159265358979323846+2.7182818284590452354;
      _f[0]=d;let lo=_u[0];const hi=_u[1];
      if(lo<m)lo=(lo+m)>>>0;
      this.hi[i]=hi;this.lo[i]=lo;
    }
    for(let i=0;i<10;i++)this.step();
  }
  double(){
    this.step();
    _u[1]=((this._h&0x000FFFFF)|0x3FF00000)>>>0;
    _u[0]=this._l;
    return _f[0]-1.0;
  }
  int(n){return Math.floor(this.double()*n)+1;}
}
class Run{
  constructor(s){this.rng=new LuaRandom();this.state=Object.create(null);this.reset(s);}
  reset(s){
    this.seedStr=s;this.hashed=pseudohash(s);
    for(const k in this.state)delete this.state[k];
    return this;
  }
  pseudoseed(key){
    let v=this.state[key];
    if(v===undefined)v=pseudohash(key+this.seedStr);
    v=Math.abs(round13((2.134453429141+v*1.72431234)%1));
    this.state[key]=v;
    return (v+this.hashed)/2;
  }
  rand(key){this.rng.seed(this.pseudoseed(key));return this.rng.double();}
  pick(key,list){this.rng.seed(this.pseudoseed(key));return list[this.rng.int(list.length)-1];}
}

/* ========== 商店 ========== */
const EDITIONS=[[0.997,"负片"],[0.994,"多彩"],[0.98,"全息"],[0.96,"闪箔"]];

function jokerEdition(run,src,ante){
  const p=run.rand("edi"+src+ante);
  for(const [t,name] of EDITIONS) if(p>t) return name;
  return null;
}

/* 商店第 n 个位置卖什么 */
function shopSlot(run,ante){
  const t=run.rand("cdt"+ante)*28;
  /* 商店的消耗牌不 soulable（create_card 第六个参数没传），永远不会翻灵魂牌 */
  if(t>=20) return {type:t<24?"塔罗牌":"星球牌"};
  const r=run.rand("rarity"+ante+"sho");
  const rarity=r>0.95?3:(r>0.7?2:1);
  const name=run.pick("Joker"+rarity+"sho"+ante,POOLS[rarity]);
  return {type:"joker",name,rarity,edition:jokerEdition(run,"sho",ante)};
}


/* ===== 消耗牌池 ===== */
const TAROTS=["The Fool","The Magician","The High Priestess","The Empress","The Emperor","The Hierophant","The Lovers","The Chariot","Justice","The Hermit","The Wheel of Fortune","Strength","The Hanged Man","Death","Temperance","The Devil","The Tower","The Star","The Moon","The Sun","Judgement","The World"];
const PLANETS=["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune","Pluto","Planet X","Ceres","Eris"];
const SPECTRALS=["Familiar","Grim","Incantation","Talisman","Aura","Wraith","Sigil","Ouija","Ectoplasm","Immolate","Ankh","Deja Vu","Hex","Trance","Medium","Cryptid","RETRY","RETRY"];

/* 卡包权重（第一项是"这个位子没有包"） */
const PACKS=[["RETRY",22.42],["Arcana Pack",4],["Jumbo Arcana Pack",2],["Mega Arcana Pack",0.5],
["Celestial Pack",4],["Jumbo Celestial Pack",2],["Mega Celestial Pack",0.5],
["Standard Pack",4],["Jumbo Standard Pack",2],["Mega Standard Pack",0.5],
["Buffoon Pack",1.2],["Jumbo Buffoon Pack",0.6],["Mega Buffoon Pack",0.15],
["Spectral Pack",0.6],["Jumbo Spectral Pack",0.3],["Mega Spectral Pack",0.07]];

/* 加权抽签：拿第一项的权重当总量，往后累加 */
Run.prototype.weighted=function(key,items){
  this.rng.seed(this.pseudoseed(key));
  const poll=this.rng.double()*items[0][1];
  let idx=1,w=0;
  while(w<poll){w+=items[idx][1];idx++;}
  return items[idx-1][0];
};

/* 带锁的抽取：抽到锁上的就 _resample2、_resample3 重抽 */
Run.prototype.choice=function(key,items,locked){
  this.rng.seed(this.pseudoseed(key));
  let it=items[this.rng.int(items.length)-1];
  if(it!=="RETRY"&&!(locked&&locked.has(it)))return it;
  let n=2;
  while(n<=1000){
    this.rng.seed(this.pseudoseed(key+"_resample"+n));
    it=items[this.rng.int(items.length)-1];
    n++;
    if(it!=="RETRY"&&!(locked&&locked.has(it)))return it;
  }

const CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789";

function indexFromSeed(str){
  const s=str.toUpperCase().padStart(8,"A");let n=0;
  for(let i=0;i<8;i++){const p=CHARS.indexOf(s[i]);n=n*35+(p<0?0:p);}
  return n;
}
function matchSeed(seed,groups,slots,maxAnte,withPacks){
  const got=scanSeed(seed,maxAnte,slots,withPacks);

  for(const grp of groups){
    let found=null;
    for(const w of grp){
      const g=got.find(x=>x.name===w.name&&x.ante<=w.ante&&(!w.ed||x.edition===w.ed)&&!used.has(x));
      if(g){found=g;break;}
    }
    if(!found)return null;
    used.add(found);
    out.push(found);
  }
  return out;
}

const RAR_OF={};

function makePlan(groups,slots,maxAnte,withPacks){
  const needRar=new Set();
  let needLeg=false;
  const allWants=[];
  for(const grp of groups) for(const w of grp){
    allWants.push(w);
    const r=RAR_OF[w.name];
    if(r===4)needLeg=true; else needRar.add(r);
  }
  const deadline={};
  for(const grp of groups){
    const maxA=Math.max(...grp.map(w=>w.ante));
    for(const w of grp) deadline[maxA]=(deadline[maxA]||[]);
  }
  return {needRar,needLeg,groups,deadline,slots,maxAnte,withPacks};
}

/* 返回 true = 这个种子有戏，值得完整算一遍 */
function fastScan(seed,plan){
  const run=_shared.reset(seed);
  const found=new Map();   /* 名字 → 最早出现的底注 */
  const mark=(n,a)=>{ if(!found.has(n))found.set(n,a); };
  const st={};
  const {needRar,needLeg,slots,maxAnte,withPacks}=plan;

  for(let a=1;a<=maxAnte;a++){
    for(let s=1;s<=slots;s++){
      const t=run.rand("cdt"+a)*28;
      if(t<20){                                   /* 小丑位 */
        if(needRar.size){                         /* 只要传奇的话连稀有度都不用掷 */
          const r=run.rand("rarity"+a+"sho");
          const rar=r>0.95?3:(r>0.7?2:1);
          if(needRar.has(rar))
            mark(run.choice("Joker"+rar+"sho"+a,POOLS[rar]),a);
        }
      }   /* 商店的塔罗/星球不会翻灵魂牌 */
    }

    if(withPacks){
      for(let i=0,n=(a===1?4:6);i<n;i++){
        let p;
        if(a<=2&&!st.firstPack){st.firstPack=true;p="Buffoon Pack";}
        else p=run.weighted("shop_pack"+a,PACKS);
        const info=packInfo(p);
        if(info.kind==="Buffoon Pack"){
          if(!needRar.size)continue;              /* 不要普通小丑就整包跳过 */
          const locked=new Set();
          for(let k=0;k<info.size;k++){
            const r=run.rand("rarity"+a+"buf");
            const rar=r>0.95?3:(r>0.7?2:1);
            const n=run.choice("Joker"+rar+"buf"+a,POOLS[rar],locked);
            locked.add(n);
            if(needRar.has(rar))mark(n,a);
          }
        } else if(info.kind==="Arcana Pack"&&needLeg){
          let done=false;
          for(let k=0;k<info.size&&!done;k++)
            if(run.rand("soul_Tarot"+a)>0.997){
              mark(run.choice("Joker4",POOLS[4]),a);done=true;
            }
        } else if(info.kind==="Spectral Pack"&&needLeg){
          let sd=false,hd=false;
          for(let k=0;k<info.size;k++){
            const isSoul=!sd&&run.rand("soul_Spectral"+a)>0.997;
            const isHole=!hd&&run.rand("soul_Spectral"+a)>0.997;
            if(isHole)hd=true;
            else if(isSoul){sd=true;mark(run.choice("Joker4",POOLS[4]),a);}
          }
        }
      }
    }

    /* 提前放弃：某一组过了它的最晚底注还一个都没中 */
    for(const grp of plan.groups){
      const maxA=Math.max(...grp.map(w=>w.ante));
      if(a>=maxA && !grp.some(w=>found.has(w.name)&&found.get(w.name)<=w.ante))
        return false;
    }
  }
  for(const grp of plan.groups)
    if(!grp.some(w=>found.has(w.name)&&found.get(w.name)<=w.ante)) return false;
  return true;
}

/* 对外：先快速排除，看着有戏再用完整版确认 */
function matchFast(seed,plan){
  if(!fastScan(seed,plan))return null;
  return matchSeed(seed,plan.groups,plan.slots,plan.maxAnte,plan.withPacks);
}

function pseudohash(str){
  let num=1;

class LuaRandom{
  constructor(){this.hi=new Uint32Array(4);this.lo=new Uint32Array(4);}
  gen(i,k,q,s){

    r=this.gen(1,58,19,28);h^=r[0];l^=r[1];
    r=this.gen(2,55,24, 7);h^=r[0];l^=r[1];

const CHARS="ABCDEFGHIJKLMNOPQRSTUVWXYZ123456789";
const TOTAL=Math.pow(35,8);
function seedFromIndex(n){let s="";for(let i=0;i<8;i++){s=CHARS[n%35]+s;n=Math.floor(n/35);}return s;}
function indexFromSeed(str){
  const s=str.toUpperCase().padStart(8,"A");let n=0;
  for(let i=0;i<8;i++){const p=CHARS.indexOf(s[i]);n=n*35+(p<0?0:p);}
  return n;
}
function matchSeed(seed,groups,slots,maxAnte,withPacks){
  const got=scanSeed(seed,maxAnte,slots,withPacks);
  const out=[];
  const used=new Set();
  for(const grp of groups){
    let found=null;
    for(const w of grp){
      const g=got.find(x=>x.name===w.name&&x.ante<=w.ante&&(!w.ed||x.edition===w.ed)&&!used.has(x));
      if(g){found=g;break;}
    }
    if(!found)return null;
    used.add(found);
    out.push(found);
  }
  return out;
}

/* ===== 快速通道：只算条件用得上的东西，用来快速排除 ===== */
const RAR_OF={};
for(const r of [1,2,3,4]) for(const j of POOLS[r]) RAR_OF[j]=r;

function makePlan(groups,slots,maxAnte,withPacks){
  const needRar=new Set();
  let needLeg=false;
  const allWants=[];
  for(const grp of groups) for(const w of grp){
    allWants.push(w);
    const r=RAR_OF[w.name];
    if(r===4)needLeg=true; else needRar.add(r);
  }
  const deadline={};
  for(const grp of groups){
    const maxA=Math.max(...grp.map(w=>w.ante));
    for(const w of grp) deadline[maxA]=(deadline[maxA]||[]);
  }
  return {needRar,needLeg,groups,deadline,slots,maxAnte,withPacks};
}

/* 返回 true = 这个种子有戏，值得完整算一遍 */
function fastScan(seed,plan){
  const run=_shared.reset(seed);
  const found=new Map();   /* 名字 → 最早出现的底注 */
  const mark=(n,a)=>{ if(!found.has(n))found.set(n,a); };
  const st={};
  const {needRar,needLeg,slots,maxAnte,withPacks}=plan;

  for(let a=1;a<=maxAnte;a++){
    for(let s=1;s<=slots;s++){
      const t=run.rand("cdt"+a)*28;
      if(t<20){                                   /* 小丑位 */
        if(needRar.size){                         /* 只要传奇的话连稀有度都不用掷 */
          const r=run.rand("rarity"+a+"sho");
          const rar=r>0.95?3:(r>0.7?2:1);
          if(needRar.has(rar))
            mark(run.choice("Joker"+rar+"sho"+a,POOLS[rar]),a);
        }
      }   /* 商店的塔罗/星球不会翻灵魂牌 */
    }

    if(withPacks){
      for(let i=0,n=(a===1?4:6);i<n;i++){
        let p;
        if(a<=2&&!st.firstPack){st.firstPack=true;p="Buffoon Pack";}
        else p=run.weighted("shop_pack"+a,PACKS);
        const info=packInfo(p);
        if(info.kind==="Buffoon Pack"){
          if(!needRar.size)continue;              /* 不要普通小丑就整包跳过 */
          const locked=new Set();
          for(let k=0;k<info.size;k++){
            const r=run.rand("rarity"+a+"buf");
            const rar=r>0.95?3:(r>0.7?2:1);
            const n=run.choice("Joker"+rar+"buf"+a,POOLS[rar],locked);
            locked.add(n);
            if(needRar.has(rar))mark(n,a);
          }
        } else if(info.kind==="Arcana Pack"&&needLeg){
          let done=false;
          for(let k=0;k<info.size&&!done;k++)
            if(run.rand("soul_Tarot"+a)>0.997){
              mark(run.choice("Joker4",POOLS[4]),a);done=true;
            }
        } else if(info.kind==="Spectral Pack"&&needLeg){
          let sd=false,hd=false;
          for(let k=0;k<info.size;k++){
            const isSoul=!sd&&run.rand("soul_Spectral"+a)>0.997;
            const isHole=!hd&&run.rand("soul_Spectral"+a)>0.997;
            if(isHole)hd=true;
            else if(isSoul){sd=true;mark(run.choice("Joker4",POOLS[4]),a);}
          }
        }
      }
    }

    /* 提前放弃：某一组过了它的最晚底注还一个都没中 */
    for(const grp of plan.groups){
      const maxA=Math.max(...grp.map(w=>w.ante));
      if(a>=maxA && !grp.some(w=>found.has(w.name)&&found.get(w.name)<=w.ante))
        return false;
    }
  }
  for(const grp of plan.groups)
    if(!grp.some(w=>found.has(w.name)&&found.get(w.name)<=w.ante)) return false;
  return true;
}

/* 对外：先快速排除，看着有戏再用完整版确认 */
function matchFast(seed,plan){
  if(!fastScan(seed,plan))return null;
  return matchSeed(seed,plan.groups,plan.slots,plan.maxAnte,plan.withPacks);
}

onmessage = function(e){
  var d=e.data, hits=[];
  var plan=makePlan(d.groups,d.slots,d.maxAnte,d.withPacks);
  for(var i=0;i<d.count;i++){
    var seed=seedFromIndex(d.start+i);
    var m=matchFast(seed,plan);
    if(m) hits.push({seed:seed,where:m});
  }
  postMessage({tried:d.count,hits:hits});
};`;

let pool=[],running=false;
function makeWorkers(){
  const n=Math.min(navigator.hardwareConcurrency||4,8);
  const url=URL.createObjectURL(new Blob([WORKER_SRC],{type:"text/javascript"}));
  const ws=[];
  for(let i=0;i<n;i++){ try{ ws.push(new Worker(url)); }catch(err){ break; } }
  return ws;
}

    $("stat").textContent="用了 "+pool.length+" 个核心，开搜…";
    pool.forEach(w=>{
      const feed=()=>{
        if(!running||hits>=target){ if(pool.every(x=>x.idle))finish(); return; }
        w.idle=false;
        const start=cursor;cursor+=CHUNK;
        w.postMessage({start,count:CHUNK,groups,slots,maxAnte,withPacks});
      };
      w.onmessage=ev=>{
        tried+=ev.data.tried;
        ev.data.hits.forEach(h=>{ if(hits<target)report(h.seed,h.where); });
        show();
        w.idle=true;
        if(running&&hits<target)feed(); else finish();
      };
      feed();
    });
  } else {                               /* 退回单线程 */
    (async()=>{
      $("stat").textContent="这个浏览器不让开多线程，用单核跑…";
      while(running&&hits<target){
        const plan=makePlan(groups,slots,maxAnte,withPacks);
        for(let n=0;n<3000&&running&&hits<target;n++){
          const seed=seedFromIndex(cursor++);tried++;
          const m=matchFast(seed,plan);
          if(m)report(seed,m);
        }
        show();
        await new Promise(r=>setTimeout(r));
      }
      finish();
    })();
  }
};

/* ===== 复制 / 导出 ===== */
let allHits=[];
function copyText(t,btn){
  const done=()=>{ if(btn){const o=btn.textContent;btn.textContent="已复制";setTimeout(()=>btn.textContent=o,800);} };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done,()=>fallback(t,done));
  } else fallback(t,done);
}
function fallback(t,cb){
  const ta=document.createElement("textarea");
  ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");cb();}catch(e){}
  document.body.removeChild(ta);
}
document.addEventListener("click",e=>{
  const cp=e.target.closest(".cp");
  if(cp){
    const seed=cp.parentElement.querySelector(".seed").textContent.trim();
    copyText(seed,cp);
    return;
  }
  const sd=e.target.closest(".seed");
  if(sd&&!e.target.closest(".cp")){
    const t=sd.textContent.trim();
    copyText(t);
    const o=sd.textContent;sd.textContent="已复制";
    setTimeout(()=>{sd.textContent=o;},700);
  }
});

/* ===== 概率实测 ===== */
function describeGroups(groups){
  return groups.map(g=>{
    const names=g.map(w=>jname(w.name)+(w.ed?"("+w.ed+")":"")).join(" 或 ");
    const a=Math.max(...g.map(w=>w.ante));
    return names+" ≤底注"+a;
  }).join(" ＋ ");
}
function readGroups(){
  return [...document.querySelectorAll("#wants .wantgroup")].map(grp=>
    [...grp.querySelectorAll(".want")].map(d=>({
      name:d.querySelector(".j").value,
      ed:d.querySelector(".e").value,
      ante:parseInt(d.querySelector(".ant").value,10)||8
    }))
  ).filter(g=>g.length);
}
function fmtTime(s){
  if(s<1)return "不到 1 秒";
  if(s<60)return Math.round(s)+" 秒";
  if(s<3600)return Math.round(s/60)+" 分钟";
  if(s<86400)return (s/3600).toFixed(1)+" 小时";
  return (s/86400).toFixed(1)+" 天";
}

/* ===== 概率粗估（公式，瞬时） ===== */
const ED_P={"":1,"负片":0.003,"多彩":0.003,"全息":0.014,"闪箔":0.02};
const RAR_P={1:0.70,2:0.25,3:0.05};
const PACK_TOTAL=22.42;
function packP(name){
  const it=PACKS.find(x=>x[0]===name);
  return it?it[1]/PACK_TOTAL:0;
}
/* 一张小丑在某个底注里出现的期望次数 */
function lambdaPerAnte(w,ante,slots,withPacks){
  const rar=RAR_OF[w.name];
  const edp=ED_P[w.ed]||1;
  let lam=0;
  if(rar===4){
    /* 传奇只从奇术包 / 幻灵包的灵魂牌来 */
    if(!withPacks)return 0;
    const nPacks=(ante===1)?4:6;
    const arc=[["Arcana Pack",3],["Jumbo Arcana Pack",5],["Mega Arcana Pack",5]];
    const spe=[["Spectral Pack",2],["Jumbo Spectral Pack",4],["Mega Spectral Pack",4]];
    let soulPerPack=0;
    for(const [n,sz] of arc.concat(spe))
      soulPerPack += packP(n)*(1-Math.pow(1-0.003,sz));
    lam = nPacks*soulPerPack*(1/5)*edp;
  }else{
    const pool=POOLS[rar].length;
    /* 商店 */
    lam += slots*(20/28)*RAR_P[rar]*(1/pool)*edp;
    /* 小丑包 */
    if(withPacks){
      const nPacks=(ante===1)?4:6;
      let cards=0;
      for(const [n,sz] of [["Buffoon Pack",2],["Jumbo Buffoon Pack",4],["Mega Buffoon Pack",4]])
        cards += packP(n)*sz;
      if(ante<=2)cards+=2/nPacks;   /* 开局那个必定的小丑包 */
      lam += nPacks*cards*RAR_P[rar]*(1/pool)*edp;
    }
  }
  return lam;
}
function groupLambda(grp,slots,withPacks){
  let lam=0;
  for(const w of grp)
    for(let a=1;a<=w.ante;a++)
      lam += lambdaPerAnte(w,a,slots,withPacks);
  return lam;
}
function sameGroup(a,b){
  if(a.length!==b.length)return false;
  const key=g=>g.map(w=>w.name+"|"+w.ed+"|"+w.ante).sort().join(",");
  return key(a)===key(b);
}
function estimate(groups,slots,withPacks){
  /* 把完全相同的组合并，用泊松算"至少 k 个" */
  const buckets=[];
  for(const g of groups){
    const b=buckets.find(x=>sameGroup(x.grp,g));
    if(b)b.k++; else buckets.push({grp:g,k:1});
  }
  let p=1;
  for(const b of buckets){
    const lam=groupLambda(b.grp,slots,withPacks);
    if(lam<=0)return 0;
    /* P(至少 k 次)，泊松 */
    let tail=1,term=Math.exp(-lam);
    for(let j=0;j<b.k;j++){ tail-=term; term=term*lam/(j+1); }
    p *= Math.max(tail,0);
  }
  return p;
}

$("est").onclick=()=>{
  const groups=readGroups();
  if(!groups.length)return;
  const slots=parseInt($("slots").value,10)||0;
  const withPacks=$("packs").checked;
  const box=$("odds");
  box.style.display="block";

  const p=estimate(groups,slots,withPacks);
  const cores=Math.min(navigator.hardwareConcurrency||4,8);
  const speed=14000*cores*0.85;   /* 每核大概 1.4 万/秒 */

  let lv,lvName,txt;
  if(p<=0||!isFinite(p)){
    box.innerHTML='<span class="lv lv-hard">搜不到</span>这个条件不可能满足<br>'+
      '<span style="color:var(--dim)">传奇小丑只从卡包的灵魂牌出，记得勾上「连卡包里的一起搜」。</span>';
    return;
  }
  const one=Math.round(1/p);
  const sec=one/speed;
  if(sec<5){lv="lv-easy";lvName="轻松";}
  else if(sec<300){lv="lv-mid";lvName="要等等";}
  else {lv="lv-hard";lvName="硬骨头";}

  txt="大约每 <span class=\"big\">"+one.toLocaleString()+"</span> 个种子出一个<br>"+
      "按这台设备估计 <b>"+fmtTime(sec)+"</b> 出一个";
  if(sec>1800)txt+='<br><span style="color:var(--dim)">太久的话，可以放宽底注，或用「+ 或者」多加几张备选。</span>';

  box.innerHTML='<span class="lv '+lv+'">'+lvName+'</span>'+describeGroups(groups)+
    '<div style="margin-top:8px">'+txt+'</div>'+
    '<div style="margin-top:6px;color:var(--dim);font-size:13px">粗略估算，实际可能有出入</div>';
};
